# =============================================================================
# LiteLLM proxy configuration — the host-side model router.
#
# The agent container is given only this proxy's endpoint and a master key. No
# provider credential of any kind reaches it. See:
#   - docs/solution.md                  (Model routing)
#   - src/infrastructure/.env.example   (the host env contract)
#
# NOTE ON CREDENTIALS: every route now targets the host Ollama daemon, so this
# proxy holds no cloud API key at all. When a modelfiles profile is cloud-backed,
# the daemon relays to ollama.com under ITS OWN identity (~/.ollama/id_ed25519) —
# so the secret that reaches a provider belongs to the daemon, not to this file.
# ANTHROPIC_API_KEY / OPENAI_API_KEY in `.env` are currently unused.
#
# All `os.environ/NAME` values are resolved at runtime from the host `.env`
# (loaded by the proxy process), never written literally into this file.
#
# Run (host side, bound to the bridge gateway — see .env LITELLM_HOST/PORT):
#   litellm --config src/infrastructure/proxy/litellm.config.yaml \
#           --host "$LITELLM_HOST" --port "$LITELLM_PORT"
# =============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # Routing aliases — what the agent selects with Pi's /model command.
  #
  # Each route is a ROLE. Each target is a CAPABILITY: a custom Ollama model
  # built by the modelfiles project, named for what it is good at rather than
  # for who is using it. The role/capability split is the seam between the two
  # projects, and it runs in both directions:
  #
  #   role          this file          the agent's job    (Pi's system prompt)
  #   capability    models.yaml        the model's tuning (temperature, num_ctx)
  #
  # WHETHER A CAPABILITY IS CLOUD OR LOCAL IS NOT DECIDED HERE. That is the
  # modelfiles profile — `./run/build` for cloud-backed models, `./run/build
  # workstation` for local ones — and it is deliberately out of scope for this
  # project. These names resolve to whichever profile was built and created in
  # Ollama, so the same config serves a laptop and a workstation unchanged.
  #
  # Every route therefore goes to the host Ollama daemon. That holds even for
  # cloud-backed profiles: the daemon relays those to ollama.com itself, so the
  # proxy's view is uniform and OLLAMA_HOST is the only endpoint it needs.
  #
  # Each name must exist in Ollama (`ollama list`) or requests 404. Create them
  # from the modelfiles project:
  #   ollama create <capability> -f ./dist/<profile>/<capability>/Modelfile
  # ---------------------------------------------------------------------------

  # Writes and modifies code. Lowest temperature (0.2) and the largest context
  # of the set — the capability is tuned for correct, deterministic output.
  - model_name: computer-programmer
    litellm_params:
      model: ollama/computer-programming
      api_base: os.environ/OLLAMA_HOST
      api_key: none

  # Reasons about requirements, designs, and trade-offs. Balanced temperature
  # (0.5) to explore options without drifting from the requirements.
  - model_name: technical-lead
    litellm_params:
      model: ollama/technical-reasoning
      api_base: os.environ/OLLAMA_HOST
      api_key: none

  # Writes documentation and prose. Backed by the `prose-writing` capability —
  # the role is a writer, the capability is the writing itself.
  - model_name: technical-writer
    litellm_params:
      model: ollama/prose-writing
      api_base: os.environ/OLLAMA_HOST
      api_key: none

  # Threat modeling and risk assessment. Temperature 0.4 — rigorous, but with
  # enough latitude to surface non-obvious attack paths.
  - model_name: security-analyst
    litellm_params:
      model: ollama/security-analysis
      api_base: os.environ/OLLAMA_HOST
      api_key: none

litellm_settings:
  # Retry transient provider failures before surfacing an error to the agent.
  num_retries: 2
  request_timeout: 120
  # Drop unsupported params rather than erroring when routing between providers
  # with different parameter sets (e.g. local Ollama vs. cloud).
  drop_params: true
  # NO fallbacks. The previous `capable: ["fast"]` chain made sense when the
  # routes differed by POWER and a cloud outage could degrade to local. These
  # routes differ by ROLE: silently serving a security-analyst request from the
  # prose-writing model would answer with the wrong tuning and no signal to the
  # operator. A role that cannot be served should fail loudly.

general_settings:
  # The agent authenticates to the proxy with this token. It is a low-value,
  # rotatable shared secret that gates access to the proxy — deliberately NOT
  # the high-value cloud keys, which never leave this host. Held in the host
  # `.env` and given to the agent container as its only model credential.
  master_key: os.environ/LITELLM_MASTER_KEY
