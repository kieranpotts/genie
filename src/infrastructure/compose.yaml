# =============================================================================
# Secure local agent — container wiring.
#
# Brings up the three-part boundary described in docs/solution.md:
#
#   pi-container  ──MCP (HTTP/SSE)──▶  mcp-gateway ──▶ mcp-filesystem ──▶ volume
#         │
#         └────────model calls───────▶  host LiteLLM proxy (host-gateway:4000)
#
# The pi-container holds NO cloud keys and NO docker.sock. It mounts the project
# READ-ONLY, for the human operator's benefit only: the agent itself has no
# local file or shell tools at all (`--no-builtin-tools`, and no extension
# restores them), so every agent read and ALL writes go through the
# mcp-filesystem server, which is the only component with a writable handle on
# the project.
#
# Host prerequisites (see src/infrastructure/.env.example, copied to src/infrastructure/.env):
#   - Ollama bound to the bridge gateway (OLLAMA_HOST)
#   - LiteLLM proxy running on the host (LITELLM_HOST:LITELLM_PORT)
#   - PROJECT_PATH set to the absolute host path of the one project to expose
#
# Usage:
#   docker compose -f src/infrastructure/compose.yaml --env-file src/infrastructure/.env up
# =============================================================================

name: pi-secure-agent

networks:
  # Private bridge network. Only these services share it; the agent reaches the
  # host proxy across this bridge, not via host networking.
  #
  # `internal: true` is the EGRESS BOUNDARY. Without it this is an ordinary
  # bridge with outbound NAT, and the hardening table's "the only outbound
  # network is the proxy and the MCP gateway" is an absence of capability rather
  # than an enforced control. With it, Docker installs no default route and no
  # masquerade rule: external addresses are ENETUNREACH and DNS fails outright.
  #
  # The pinned subnet/gateway is NOT cosmetic — it is what keeps the model route
  # working, and the two must be changed together:
  #
  #   The `host-gateway` alias resolves to the DOCKER0 bridge address
  #   (172.17.0.1 by default), which is a DIFFERENT subnet from this network.
  #   On a routed bridge that is fine — the default route carries it. On an
  #   internal network there is no default route, so `host-gateway:host-gateway`
  #   becomes unroutable and every model call fails with ENETUNREACH.
  #
  #   The host is still reachable, but only at THIS network's own gateway
  #   address, which is a host interface. So the subnet and gateway are pinned
  #   here to make that address stable, and the pi service's `extra_hosts` maps
  #   `host-gateway` to it explicitly instead of using the alias.
  #
  # Change this subnet only if it collides with something on the host, and if
  # you do, change the pi service's `extra_hosts` entry to match. They are one
  # setting written in two places; there is no way to derive one from the other
  # in compose.
  #
  # This also rules out `--verify-signatures` on the gateway, which needs
  # outbound access to the sigstore TUF mirror. See TODO.md for why that is the
  # right trade against digest pinning.
  agent-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.60.0/24
          gateway: 172.31.60.1

volumes:
  # The single project the agent is scoped to. Backed by PROJECT_PATH on the
  # host so work is visible/editable from outside, but the agent only ever sees
  # it through the MCP server — never as a direct mount.
  project:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_PATH:?set PROJECT_PATH in src/infrastructure/.env}
  # Pi session transcripts, persisted outside any project tree (sensitive).
  pi-sessions:
  # Audit trails (permission-gate). A separate volume from sessions so the
  # accountability logs have their own lifecycle and can be retained/shipped
  # independently of transcripts.
  #
  # The agent runs as uid 1001, so this volume must be owned by it or the logs
  # fail silently. Ownership is seeded from the image's /var/log/pi, which means
  # a volume created before that Dockerfile layer existed is still root-owned:
  # `docker volume rm pi-secure-agent_pi-logs` to re-seed it. See the Dockerfile.
  pi-logs:

services:
  # ---------------------------------------------------------------------------
  # MCP gateway (Docker MCP Toolkit) — the sole holder of filesystem access and
  # the boundary the agent reaches files through.
  #
  # IMPORTANT — corrected against the real Toolkit (verified via
  # `docker mcp gateway run --help`): the gateway does NOT front a sibling
  # `mcp/filesystem` service. It SPAWNS and manages the filesystem MCP server
  # itself, and learns that server's command args + volume mounts from a
  # CATALOG entry — not from `--oci-ref` alone. So we point it at our catalog
  # (mcp/toolkit/catalog.yaml) and enable the `filesystem` server from it. The
  # catalog's `command` is the allowed-directory boundary; its `volumes` is what
  # the spawned server can see. That file, not this one, defines the boundary.
  #
  # Because it orchestrates containers, the gateway needs the Docker socket — so
  # the docker.sock privilege lives HERE, on the gateway, and never on the
  # pi-container. This is the deliberate, contained trade-off: see
  # "The gateway, and the docker.sock trade-off" in docs/solution.md, and the
  # docker.sock section of src/infrastructure/README.md.
  #
  # `--block-secrets` (default true) and `--log-calls` (default true) are left
  # on; `--block-network` denies tools forbidden network access.
  # ---------------------------------------------------------------------------
  mcp-gateway:
    # Digest-pinned (tag docker/mcp-gateway:latest) for reproducibility. Re-pin:
    #   docker pull docker/mcp-gateway:latest && docker inspect --format '{{index .RepoDigests 0}}' docker/mcp-gateway:latest
    image: docker/mcp-gateway:latest@sha256:e3d667226b5a58ddf5b12cb357085a71f5f5e63383915a19e6ff4c983c92b34a
    command:
      - "--transport=streaming"
      - "--port=8811"
      - "--catalog=/etc/mcp/catalog.yaml"
      - "--servers=filesystem"
      - "--block-network"
      # --block-secrets and --log-calls default to true.
    networks:
      - agent-net
    volumes:
      # The catalog that defines the filesystem server (its allowed-dir arg and
      # the project mount). Read-only — the gateway only reads it.
      - ./mcp/toolkit/catalog.yaml:/etc/mcp/catalog.yaml:ro
      # The project volume. The gateway passes this through to the spawned
      # filesystem server per the catalog's `volumes` entry; the mounted path
      # IS the security boundary.
      - project:/workspace
      # Required because the gateway orchestrates MCP server containers. This is
      # the ONE place a Docker socket is granted — never to the agent.
      - /var/run/docker.sock:/var/run/docker.sock
    # No auth token on this endpoint, deliberately. The gateway enforces bearer
    # auth only when it binds to localhost OUTSIDE a container, where the threat
    # is DNS rebinding from a browser on the same host; running in a container it
    # logs "Authentication disabled" and ignores the token entirely. Setting one
    # bought nothing except the appearance of a control.
    #
    # What actually scopes reachability is the network: `agent-net` is a private
    # bridge, port 8811 is not published to the host, and the only other member
    # is the pi container. Nothing outside the compose project can address it.
    # Hardening. The gateway is the most privileged container here (it holds the
    # Docker socket), so it is hardened as far as that role allows:
    #   - no-new-privileges: cannot gain privileges via setuid binaries.
    #   - cap_drop ALL: talking to the socket is a daemon API call, so the
    #     gateway process itself needs no Linux capabilities. If the gateway
    #     fails to start, this is the first thing to relax (restore the minimum
    #     it reports needing) — verify on first live bring-up.
    #   - read_only rootfs + tmpfs: a compromised gateway cannot persist tooling
    #     to its own filesystem; transient writes go to in-memory tmpfs only.
    #     The Docker socket is a bind mount and unaffected by read_only.
    # NOTE: the socket itself remains the irreducible privilege; for stricter
    # environments, replace the raw socket bind with a docker-socket-proxy
    # allowlisting only the container APIs the gateway needs. This is the
    # mitigation for the concern that got the third alternative in
    # docs/alternatives.md rejected — granting broad host privilege via
    # docker.sock — which this design answers by confining it to the gateway
    # rather than handing it to the agent.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /run
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # The agent. No keys, no socket, no project mount. Reaches files only through
  # the MCP gateway and models only through the host proxy. Runtime hardening
  # here mirrors the footer of pi-container/Dockerfile.
  # ---------------------------------------------------------------------------
  pi:
    build:
      context: ../..
      dockerfile: src/infrastructure/pi-container/Dockerfile
    image: pi-agent:hardened
    # PID 1 idles; it is NOT the agent and NOT a shell.
    #
    # The image's default command is a shell whose ~/.bashrc auto-starts the
    # hardened harness, so an OPERATOR session lands straight in Pi and `/quit`
    # drops back to a shell. Under `up -d` there is no operator: the container's
    # own TTY is attached to nobody, so that shell would start an agent that
    # sits unwatched at a prompt, consuming a model session. Idling here means
    # an agent starts only when someone actually enters:
    #
    #   docker compose -f src/infrastructure/compose.yaml exec pi bash
    #
    # This override is safe in a way the previous one was not: the launch flags
    # (--model, --no-builtin-tools) now live in `start-pi` inside the image, so
    # replacing the command cannot silently weaken the tool profile.
    command: ["sleep", "infinity"]
    # `sleep` as PID 1 would not reap orphaned children; docker-init does.
    init: true
    networks:
      - agent-net
    depends_on:
      - mcp-gateway
    # Map host-gateway so the container can reach the host-side LiteLLM proxy.
    #
    # This is the LITERAL gateway address of `agent-net`, not Docker's
    # `host-gateway` alias. The alias points at docker0 (172.17.0.1), which is
    # unroutable from an internal network — see the long note on `agent-net`.
    # Keep this in step with the `gateway:` pinned there.
    #
    # Consequence worth knowing: the proxy must listen on an address reachable
    # from this bridge, so a LiteLLM bound to 127.0.0.1 will NOT work. That was
    # already true (it had to answer on docker0 before), so this changes which
    # address it must answer on, not whether it must answer beyond loopback.
    extra_hosts:
      - "host-gateway:172.31.60.1"
    volumes:
      # No docker.sock, no host dotfiles.
      # Pi's own session transcripts.
      - pi-sessions:/home/pi/sessions
      # Audit trails. The agent can append but the volume outlives the
      # container, so a compromised session cannot erase its own history.
      - pi-logs:/var/log/pi
      # The project, READ-ONLY, and FOR THE OPERATOR — not for the agent.
      #
      # An operator who lands in this container (`exec pi bash`, or /quit out of
      # the agent) needs to see what they are working with; being unable to was a
      # real usability failure, and "look at it on the host instead" does not
      # answer "what can the agent actually see?".
      #
      # The agent's own route to these files remains the MCP server, which
      # mediates and logs every access. What keeps this mount from becoming a
      # second, unmediated route is that the agent has NO TOOL that can read it:
      # `--no-builtin-tools` removes Pi's own read/grep/find/edit, and no
      # extension restores local file or shell access. The `mcp_*` tools are the
      # only file surface it has, and they resolve inside the MCP server's own
      # container, not this one.
      #
      # This replaced a path fence in a since-removed `audited-tools` extension,
      # which policed the same boundary from inside the agent's own process — a
      # cooperative guard rather than an absence of capability. See TODO.md.
      #
      # `:ro` remains load-bearing: it means the ONLY writable route to the
      # project is the MCP server, so the audit trail of changes stays complete
      # even if the agent were to regain a local tool.
      - project:/workspace:ro
      # Keep this path in step with PI_PROJECT_DIR below, which is where an
      # operator's shell lands.
      #
      # Pi's agent directory, on a tmpfs. NOT optional, and not a convenience:
      # Pi takes a lockfile on `trust.json` at startup (proper-lockfile, which
      # locks by `mkdir`), so on the read-only rootfs it died before reaching a
      # prompt with `EROFS: read-only file system, mkdir
      # '/home/pi/.pi/agent/trust.json.lock'`.
      #
      # `mode` is load-bearing. A tmpfs mounts root-owned 0755 by default and
      # this container runs as uid 1001, so without 1777 the mount is present
      # and unwritable — the same failure, one directory further in.
      # `seed-agent-dir` then creates the agent dir inside it as the agent's own
      # user, mode 0700, so the loose mode is on the mount point only.
      #
      # Long syntax because the `tmpfs:` short list below cannot express a mode.
      #
      # Being a tmpfs, this MASKS whatever the image has at the path — which is
      # why the extensions and models.json are baked to /opt/pi/agent instead
      # and copied in on entry. Nothing here survives a restart, deliberately:
      # the image is the only source of truth for what extensions run.
      - type: tmpfs
        target: /home/pi/.pi
        tmpfs:
          mode: 01777
    environment:
      # Model access: proxy token ONLY. No cloud API keys. The proxy ENDPOINT is
      # declared in the image's models.json (pi-container/models.json) — Pi reads
      # that to expose the role routes; it does not read a bare
      # endpoint env var. models.json pins host-gateway:4000, so keep it in sync
      # with LITELLM_PORT if you change the proxy port. This token is interpolated
      # into models.json's `apiKey` at runtime (`$LITELLM_MASTER_KEY`).
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in src/infrastructure/.env}"
      # Filesystem access: the MCP gateway's streamable-HTTP endpoint on
      # agent-net, used by the mcp-client extension. This is the agent's ONLY
      # route to project files. The path is /mcp because the gateway runs
      # --transport=streaming (above); the old /sse path only 307-redirects here.
      # No auth token — see the note on the gateway service.
      MCP_GATEWAY_URL: "http://mcp-gateway:8811/mcp"
      # Where an OPERATOR's interactive shell lands (see the image's ~/.bashrc),
      # so entering the container puts you in the project rather than an empty
      # home. Nothing about the agent's own access is derived from this.
      PI_PROJECT_DIR: "/workspace"
      # Interactive approval: the permission-gate extension requires confirmation
      # for mutating tool calls, refuses sensitive filenames outright on every
      # call (including the mcp_* ones), and logs EVERY call here — reads
      # included, which are never prompted for but are still actions against the
      # filesystem. Since `audited-tools` was removed this is the system's only
      # audit trail, so what it omits is not recorded anywhere.
      PERMISSION_GATE_CALL_LOG: "/var/log/pi/permission-gate/calls.jsonl"
      # Role `start-pi` launches on. The proxy exposes one route per role —
      # computer-programmer, technical-lead, technical-writer, security-analyst
      # — each backed by a capability-tuned Ollama model (litellm.config.yaml).
      # All four are declared in the image's models.json; Pi's /model command
      # switches between them at runtime.
      PI_MODEL: "litellm/computer-programmer"
      # Project trust, decided here rather than by an interactive prompt.
      #
      # Pi asks "Trust project folder?" when the working tree holds
      # trust-requiring resources — `.agents/skills` in cwd or any ancestor, or
      # a `.pi/` config directory. Trust lets it load project settings, install
      # project packages, and EXECUTE project extensions in Pi's own process,
      # alongside permission-gate rather than behind it.
      #
      # `deny` keeps that shut and, just as importantly, makes the run
      # deterministic: the prompt would otherwise block any non-interactive
      # invocation, and since the agent directory is a tmpfs it is never
      # remembered, so it would block EVERY run rather than just the first.
      #
      # Set to `approve` to load a project's own skills and settings. Only do
      # that for a project whose contents you trust as much as this repo's,
      # because from then on its extensions run inside the agent.
      PI_PROJECT_TRUST: "deny"
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_CODING_AGENT_SESSION_DIR: "/home/pi/sessions"
    # Runtime hardening (cannot be set in a Dockerfile).
    user: "1001:1001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 2g
    pids_limit: 512
    # Interactive agent session.
    stdin_open: true
    tty: true
